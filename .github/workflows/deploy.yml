# ============================================================
#  Deploy MaxxHits to Hostinger over FTPS
#
#  Runs on every push to main (and manually from the Actions
#  tab). Requires these repository secrets
#  (GitHub → Settings → Secrets and variables → Actions):
#
#    FTP_SERVER    e.g. ftp.yourdomain.com  (hPanel → Files → FTP Accounts)
#    FTP_USERNAME  the FTP account username
#    FTP_PASSWORD  the FTP account password
#
#  Optional repository VARIABLE (not secret):
#    FTP_SERVER_DIR  target folder, default: public_html/
#
#  Full setup instructions: see DEPLOYMENT.md
# ============================================================

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Only changed files are uploaded (state file kept on the
          # server). Never deletes files it didn't upload itself, so
          # db.config.php / uploads on the server are safe.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            DEPLOYMENT.md
